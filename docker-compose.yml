version: '3.8'
services:

  # MySQL
  mysql:
    profiles: ["all", "mysql"]
    image: mysql:8.0
    cap_add:
      - SYS_NICE
    environment:
      MYSQL_DATABASE: ${mysql_database_name}
      MYSQL_ROOT_PASSWORD: ${mysql_database_password}
    ports:
      - "${mysql_port}:3306"
    expose:
      - "3306"
    volumes:
      - mysql-db:/var/lib/mysql
      - ./mysql-db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./.env:/.env
  
  # PostgreSQL.
  postgres:
    profiles: ["all", "postgres"]
    image: postgres:13.3-alpine
    ports:
      - "${postgres_port}:5432"
    environment:  # https://github.com/docker-library/docs/tree/master/postgres#environment-variables
      - POSTGRES_USER=${postgres_admin_user}
      - POSTGRES_PASSWORD=${postgres_admin_password}
      - POSTGRES_DB=${postgres_database_name}
    volumes:
      - ./.env:/.env
      - postgres-volume:/var/lib/postgresql/data
  
  #MongoDB
  mongodb:
    profiles: ["all", "mongodb"]
    image: mongo:6-jammy
    hostname: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${mongo_admin_user}
      MONGO_INITDB_ROOT_PASSWORD: ${mongo_admin_password}
    ports:
      - "${mongo_port}:27017"
    volumes:
      - ./mongodb/initdb.d/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
  
  #OracleDB
  oracle-db:
    profiles: ["all", "oracle"]
    image: container-registry.oracle.com/database/enterprise:latest
    environment:
      - ORACLE_SID=ORCLCDB
      - ORACLE_PDB=ORCLPDB1
      - ORACLE_PWD=Oracle_123
    ports:
      - 1521:1521
    volumes:
      - oracle-data:/opt/oracle/oradata
      - oracle-backup:/opt/oracle/backup
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "sys/Oracle_123@//localhost:1521/ORCLCDB as sysdba", "@healthcheck.sql"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  mysql-db:
    driver: local
  postgres-volume:
    external: false
  dbdata6:
  oracle-data:
  oracle-backup: